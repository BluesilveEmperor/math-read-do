schema_version: 2.0
default_entrypoint: math_reproduction_workflow_skill

# ── 跨分支产物路径/命名约定 ──────────────────────────────────────
# H8 统一声明：本分支 output_artifacts 使用中文目录（实验复刻结果汇总/），
# main 分支使用英文目录（reports/）。path_aliases 提供中文→英文映射，
# 供跨分支工具/脚本做路径归一化。下游引用中文路径的代码无需修改，
# 通过 path_aliases 可解析到对应的英文路径。
path_aliases:
  "实验复刻结果汇总/实验报告/": "reports/"
  "实验复刻结果汇总/实验结果对比表/": "reports/"
  "实验复刻结果汇总/实验图表（含代码）/": "reports/figures/"
  "实验复刻结果汇总/": "reports/"
# 模板文件命名统一为 snake_case（Python 惯例）。
# 注意：main 分支的 literature-reader.mpe.css 使用 kebab-case，本分支为
# literature_reader.mpe.css（snake_case）。跨分支引用时以本声明为准。
naming_convention: snake_case

metadata:
  name: Math Paper Reproduction Workflow
  description: 数学文献实验复现标准化流程 / Standardized Math Paper Reproduction Pipeline
  domain: mathematics
  subdomains: [numerical_computing, symbolic_algebra, ai4math, statistics, optimization]
  languages: [zh, en]

skills:
  - name: infrastructure_orchestration_skill
    phase: infrastructure
    path: skills/infrastructure_orchestration_skill
    description: 宿主环境检测与VM/容器编排 / Host detection and VM/container orchestration
    risk_level: medium
    requires_approval_for: [vm_provisioning, docker_build, wsl_setup]
    output_artifacts:
      - infra/infra_manifest.json
      - infra/gpu_manifest.json
      - infra/Vagrantfile
      - infra/Dockerfile
    requires_skills: []

  - name: version_management_skill
    phase: environment
    path: skills/version_management_skill
    description: 语言运行时与编译器版本管理 / Language runtime and compiler version management
    risk_level: medium
    requires_approval_for: [install_language_runtime, change_compiler_version, install_cuda]
    output_artifacts:
      - env/version_spec.json
      - env/reproduction_manifest.json
      - env/conda-lock.yml
    requires_skills: [infrastructure_orchestration_skill]

  # 2026-09-28 结构自洽清理：移除 6 条指向不存在 skills/ 子目录的悬空注册
  # （paper_parsing / environment_setup / baseline_verification / incremental_implementation /
  #   experiment_execution / artifact_packaging）——对应阶段动作均由主 SKILL.md 直接承载；
  #   artifact_packaging 的 dist/ 产物属未实现设想，待实现后再注册。

  - name: statistical_verification_skill
    phase: verification
    path: skills/statistical_verification_skill
    description: 统计验证与判决（中位数 percentile bootstrap + Wilson 判决、双种子稳健性自检、翻转风险分级、根因归因、口径 B 通过率矩阵） / Statistical verification with median bootstrap + Wilson verdict, dual-seed robustness check, flip-risk grading, root-cause attribution and criterion-B checker matrix
    risk_level: low
    requires_approval_for: []
    output_artifacts:
      - 实验复刻结果汇总/实验报告/判决结果.json
      - 实验复刻结果汇总/实验报告/口径B通过率矩阵.md
      - 实验复刻结果汇总/实验报告/口径B通过率矩阵-CN.md
      - 实验复刻结果汇总/实验报告/诊断分析.md
      - 实验复刻结果汇总/实验报告/诊断分析-CN.md
      - analysis/gray_areas.md
    requires_skills: []  # 多轮运行产出由主流程 Phase 5.1 承载（原 experiment_execution_skill 注册已随悬空清理移除）

  - name: bilingual_report_skill
    phase: reporting
    path: skills/bilingual_report_skill
    description: 中英双语报告生成 / Bilingual report generation (zh + en)
    risk_level: low
    requires_approval_for: []
    output_artifacts:
      - 实验复刻结果汇总/实验报告/复现报告.md
      - 实验复刻结果汇总/实验报告/复现报告-CN.md
      - 实验复刻结果汇总/实验结果对比表/实验结果对比表.md
      - 实验复刻结果汇总/实验结果对比表/实验结果对比表-CN.md
      - 实验复刻结果汇总/实验报告/运行摘要.md
      - 实验复刻结果汇总/实验报告/运行摘要-CN.md
    requires_skills: [statistical_verification_skill]

  # nature-* 跨树引用：path 指向仓库根 nature-archify/，目录与 SKILL.md 实际存在，非悬空；
  # nature-* 内容受保护红线约束，不在 workflow 进化范围内。
  - name: architecture_figure_skill
    phase: reporting
    path: nature-archify
    description: 系统架构图渲染器（Node CLI，5 类图 architecture/workflow/sequence/dataflow/lifecycle，13 视觉预设，9 项 showcase 校验；产物 self-contained inline-SVG HTML，内嵌 HarmonyOS Sans Medium 子集字体，深/浅双主题）
    risk_level: low
    requires_approval_for: []
    output_artifacts:
      - figures/*.html
      - figures/receipt.json
    requires_skills: []
    runtime: Node.js >= 18 (zero external dependencies)
    python_bridge: scripts/nature_archify_bridge.py
